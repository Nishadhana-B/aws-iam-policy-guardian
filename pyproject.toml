[project]
name = "iam-policy-guardian"
version = "0.1.0"
description = "AI agent that flags over-permissive IAM policies and drafts least-privilege remediations, with human-in-the-loop approval before anything is applied."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
